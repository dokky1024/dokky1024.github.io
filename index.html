<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Web Mafia Online</title>
    <style>
        /* 기본 초기화 */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background-color: #0c0c0c; color: #e0e0e0; font-family: 'Pretendard', sans-serif; overflow: hidden; }

.hidden { display: none !important; }

/* 입장 게이트 */
.overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; display: flex; align-items: center; justify-content: center; }
.login-box { text-align: center; width: 80%; max-width: 300px; }
.login-box h1 { color: #cf0000; font-size: 3rem; margin-bottom: 20px; letter-spacing: 5px; }
.login-box input { width: 100%; padding: 12px; margin: 5px 0; background: #222; border: 1px solid #444; color: #fff; border-radius: 5px; text-align: center; }
.login-box button { width: 100%; padding: 12px; background: #cf0000; border: none; color: #fff; font-weight: bold; border-radius: 5px; margin-top: 10px; cursor: pointer; }

/* 메인 구조 */
/* 전체 컨테이너 높이 수정 */
#game-container { 
    display: flex; 
    flex-direction: column; 
    height: 100vh; 
    height: -webkit-fill-available; /* iOS 대응 */
    position: fixed; /* 화면 고정 */
    width: 100%;
    top: 0;
    left: 0;
}

/* 채팅 영역이 남은 공간을 다 차지하도록 */
#chat-area { 
    flex: 1; 
    overflow-y: auto; 
    padding: 15px; 
    display: flex; 
    flex-direction: column; 
    gap: 8px;
    background: #0c0c0c;
}

/* 하단 입력바 - 모바일 키보드 위로 올라오도록 설정 */
footer { 
    height: 70px; 
    background: #1a1a1a; 
    display: flex; 
    align-items: center; 
    padding: 10px; 
    gap: 10px; 
    border-top: 1px solid #333;
    padding-bottom: env(safe-area-inset-bottom); /* 아이폰 하단 바 대응 */
}

/* 채팅 스타일 */
.system-msg { color: #ffcc00; font-size: 0.9rem; text-align: center; background: rgba(255, 204, 0, 0.1); padding: 5px; border-radius: 5px; }
.chat-msg { background: #222; padding: 8px 12px; border-radius: 15px; max-width: 85%; align-self: flex-start; line-height: 1.4; }
.my-msg { background: #3d3d3d; align-self: flex-end; }

/* 하단 입력바 */
footer { height: 60px; background: #1a1a1a; display: flex; align-items: center; padding: 10px; gap: 10px; border-top: 1px solid #333; }
#chat-input { flex: 1; background: #2a2a2a; border: none; color: #fff; padding: 10px; border-radius: 20px; }
#send-btn { background: none; border: none; color: #cf0000; font-size: 1.5rem; }

/* 사이드바 */
#sidebar { position: fixed; top: 0; left: 0; width: 70%; height: 100%; background: #151515; z-index: 500; transition: transform 0.3s ease; box-shadow: 5px 0 15px rgba(0,0,0,0.5); padding: 20px; }
.sidebar-hidden { transform: translateX(-100%); }
.sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
#player-list { list-style: none; overflow-y: auto; height: calc(100% - 120px); }
#player-list li { padding: 10px 0; border-bottom: 1px solid #222; display: flex; justify-content: space-between; }
.sidebar-footer { position: absolute; bottom: 20px; left: 20px; display: flex; gap: 20px; font-size: 1.5rem; color: #888; }

/* 도움말 모달 */
.modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; display: flex; align-items: center; justify-content: center; }
.modal-content { background: #222; padding: 20px; border-radius: 10px; width: 85%; max-height: 70%; overflow-y: auto; }
<div id="setup-modal" class="modal hidden">
    <div class="modal-content">
        <span class="close-setup" onclick="closeSetup()">&times;</span>
        <h2>게임 룰 설정</h2>
        <div class="setup-item">
            <label>회의 시간(초):</label>
            <input type="number" id="setup-meeting-time" value="60">
        </div>
        <div class="setup-item">
            <label>투표 시간(초):</label>
            <input type="number" id="setup-vote-time" value="30">
        </div>
        <div class="setup-item">
            <label>마피아 수:</label>
            <input type="number" id="setup-mafia-count" value="1">
        </div>
        <hr>
        <h3>사용할 직업 (체크리스트)</h3>
        <div id="job-checklist">
            </div>
        <button onclick="saveSetup()" class="save-btn">설정 저장</button>
    </div>
</div>

#vote-panel button {
    width: 100%;
    padding: 10px;
    margin: 5px 0;
    background: #444;
    color: white;
    border: 1px solid #666;
    border-radius: 5px;
}
#vote-panel button:hover { background: #cf0000; }
.setup-item { display: flex; justify-content: space-between; margin: 10px 0; align-items: center; }
.setup-item input { width: 60px; background: #333; border: 1px solid #555; color: #fff; padding: 5px; }
#job-checklist { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin: 15px 0; max-height: 200px; overflow-y: auto; text-align: left; }
.job-opt { font-size: 0.8rem; display: flex; align-items: center; gap: 5px; }
.save-btn { width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }

    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div id="login-gate" class="overlay">
        <div class="login-box">
            <h1>MAFIA</h1>
            <input type="password" id="room-pw" placeholder="비밀번호 입력">
            <input type="text" id="user-nickname" placeholder="닉네임 입력" maxlength="8">
            <button onclick="checkAccess()">입장하기</button>
        </div>
    </div>

    <div id="game-container" class="hidden">
        <header>
            <div id="menu-btn" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </div>
            <div id="game-status">대기 중...</div>
            <div id="timer">00:00</div>
        </header>

        <main id="chat-area">
            <div class="system-msg">방에 입장했습니다. !게임시작을 입력하세요.</div>
        </main>

        <footer>
            <input type="text" id="chat-input" placeholder="메시지를 입력하세요...">
            <button id="send-btn"><i class="fas fa-paper-plane"></i></button>
        </footer>

        <aside id="sidebar" class="sidebar-hidden">
            <div class="sidebar-header">
                <h3>생존자 명단</h3>
                <i class="fas fa-times" onclick="toggleSidebar()"></i>
            </div>
            <ul id="player-list">
                </ul>
            <div class="sidebar-footer">
                <i class="fas fa-cog" id="setup-btn" title="설정"></i>
                <i class="fas fa-question-circle" id="help-btn" title="도움말"></i>
            </div>
        </aside>
    </div>

    <div id="help-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>게임 설명</h2>
            <p>마피아는 시민을 전멸시키면 승리합니다.</p>
            <p>시민은 모든 마피아를 찾아내면 승리합니다.</p>
            <p>중립은 각자의 목표를 달성해야 합니다.</p>
        </div>
    </div>
<script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>

<script>
    // 1. Firebase 설정 (본인의 Firebase 프로젝트 키로 교체 필요)
    const firebaseConfig = {
        apiKey: "AIzaSyA6Plgr7YiOvluYlyWH3L3bhpQPDfvX0d0",
  authDomain: "mafiagamejjjdaon-8d20d.firebaseapp.com",
  databaseURL: "https://mafiagamejjjdaon-8d20d-default-rtdb.firebaseio.com",
  projectId: "mafiagamejjjdaon-8d20d",
  storageBucket: "mafiagamejjjdaon-8d20d.firebasestorage.app",
  messagingSenderId: "740156732852",
  appId: "1:740156732852:web:738ccad1d04e9f83a52ee1"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 전역 변수
    let myNickname = "";
    let isHost = false;
    let myId = Math.random().toString(36).substring(2, 9); // 임시 고유 ID

    // 2. 입장 체크 함수
    function checkAccess() {
        const pw = document.getElementById('room-pw').value;
        const nick = document.getElementById('user-nickname').value.trim();

        if (pw !== "1024") {
            alert("비밀번호가 틀렸습니다.");
            return;
        }
        if (!nick) {
            alert("닉네임을 입력해주세요.");
            return;
        }

        myNickname = nick;
        document.getElementById('login-gate').classList.add('hidden');
        document.getElementById('game-container').classList.remove('hidden');
        
        enterRoom();
    }

    // 3. 방 입장 및 유저 등록
    function enterRoom() {
        const userRef = db.ref('users/' + myId);
        userRef.set({
            nickname: myNickname,
            isHost: false,
            status: "alive"
        });

        // 브라우저 종료 시 유저 정보 삭제
        userRef.onDisconnect().remove();

        // 방장 선출 로직 (가장 먼저 들어온 유저)
        db.ref('users').limitToFirst(1).on('value', (snapshot) => {
            const firstUser = snapshot.val();
            if (firstUser && Object.keys(firstUser)[0] === myId) {
                isHost = true;
                userRef.update({ isHost: true });
            }
        });

        listenChat();
        listenPlayers();
        listenGameState();
        listenWeather();
    }

    // 4. 실시간 채팅 수신
    function listenChat() {
        const chatRef = db.ref('chat');
        chatRef.limitToLast(50).on('child_added', (snapshot) => {
            const data = snapshot.val();
            displayMessage(data.sender, data.text, data.type);
        });
    }

    // 5. 메시지 표시 함수
    function displayMessage(sender, text, type) {
        const chatArea = document.getElementById('chat-area');
        const msgDiv = document.createElement('div');
        
        if (type === "system") {
            msgDiv.className = "system-msg";
            msgDiv.innerText = text;
        } else {
            msgDiv.className = (sender === myNickname) ? "chat-msg my-msg" : "chat-msg";
            msgDiv.innerText = `${sender}: ${text}`;
        }
        
        chatArea.appendChild(msgDiv);
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    // 6. 메시지 전송 및 명령어 처리
    document.getElementById('send-btn').addEventListener('click', sendMessage);
    document.getElementById('chat-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    function sendMessage() {
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if (!text) return;

        // 명령어 처리
        if (text === "!클리어") {
            document.getElementById('chat-area').innerHTML = "";
            input.value = "";
            return;
        }

        if (text === "!게임시작") {
            if (!isHost) {
                displayMessage("시스템", "방장만 게임을 시작할 수 있습니다.", "system");
            } else {
                checkStartGame();
            }
            input.value = "";
            return;
        }

        db.ref('chat').push({
            sender: myNickname,
            text: text,
            type: "user"
        });
        input.value = "";
    }

    // 7. 생존자 목록 업데이트 (사이드바)
    function listenPlayers() {
        db.ref('users').on('value', (snapshot) => {
            const players = snapshot.val();
            const listEl = document.getElementById('player-list');
            listEl.innerHTML = "";
            
            for (let id in players) {
                const li = document.createElement('li');
                let hostTag = players[id].isHost ? " (방장)" : "";
                li.innerText = `${players[id].nickname}${hostTag}`;
                listEl.appendChild(li);
            }
        });
    }

    // 사이드바 토글
    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('sidebar-hidden');
    }

    // 게임 시작 전 인원 체크
    function checkStartGame() {
        db.ref('users').once('value', (snapshot) => {
            const count = Object.keys(snapshot.val() || {}).length;
            if (count < 3) {
                db.ref('chat').push({
                    sender: "시스템",
                    text: "게임은 3명 이상 필요합니다.",
                    type: "system"
                });
            } else {
                // TODO: Part 3에서 게임 시작 로직 구현
                db.ref('chat').push({ sender: "시스템", text: "게임을 시작합니다!", type: "system" });
            }
        });
    }
    // 1. 직업 데이터 정의 (21개 직업)
const JOBS = {
    1: { name: "시민", team: "citizen", ability: "none" },
    2: { name: "경찰", team: "citizen", ability: "check" },
    3: { name: "의사", team: "citizen", ability: "heal" },
    4: { name: "감시자", team: "citizen", ability: "watch" },
    5: { name: "미치광이 의사", team: "citizen", ability: "kill_heal" },
    6: { name: "군인", team: "citizen", ability: "shield" },
    7: { name: "연인", team: "citizen", ability: "love_chat" },
    8: { name: "시장", team: "variable", ability: "triple_vote" }, // 시작 시 진영 랜덤
    9: { name: "개표인", team: "variable", ability: "manipulate" }, // 시작 시 진영 랜덤
    10: { name: "사제", team: "citizen", ability: "revive" },
    11: { name: "기술자", team: "citizen", ability: "block" },
    12: { name: "테러리스트", team: "citizen", ability: "boom" },
    13: { name: "배신자", team: "variable", ability: "betray" }, // 마피아 1명 남을 시 전직
    14: { name: "자경단", team: "citizen", ability: "kill_once" },
    15: { name: "광대", team: "neutral", ability: "troll" },
    16: { name: "감염자", team: "neutral", ability: "infect" },
    17: { name: "식인종", team: "neutral", ability: "eat" },
    18: { name: "암살자", team: "mafia", ability: "kill_stealth" },
    19: { name: "변장술사", team: "mafia", ability: "disguise" },
    20: { name: "마녀", team: "mafia", ability: "witch_kill" },
    21: { name: "마피아", team: "mafia", ability: "kill" }
};

// 게임 상태 관리 변수
let gameState = "waiting"; // waiting, night, morning, evening
let myJob = null;
let myTeam = "";
let isDead = false;

// 2. 게임 시작 로직 (방장 전용)
function startGame() {
    db.ref('users').once('value', (snapshot) => {
        const users = snapshot.val();
        const userIds = Object.keys(users);
        const playerCount = userIds.length;

        // 직업 섞기 및 배정 로직 (기본 설정: 마피아 1, 중립 1, 나머지 시민 기반)
        // 실제 구현 시 '톱니바퀴 설정'값을 가져와야 하지만, 우선 기본 랜덤 배정
        let selectedJobs = [21, 15]; // 기본 마피아, 광대 포함
        while (selectedJobs.length < playerCount) {
            selectedJobs.push(1); // 나머지는 시민으로 채움 (추후 설정 반영)
        }
        
        // 직업 무작위 셔플
        selectedJobs.sort(() => Math.random() - 0.5);
        
        decideWeather();
        
        const updates = {};
        userIds.forEach((id, index) => {
            let jobId = selectedJobs[index];
            let jobInfo = JOBS[jobId];
            let team = jobInfo.team;

            // 가변 진영(시장, 개표인 등) 랜덤 설정
            if (team === "variable") {
                team = Math.random() > 0.5 ? "citizen" : "mafia";
            }

            updates[`users/${id}/job`] = jobInfo.name;
            updates[`users/${id}/jobId`] = jobId;
            updates[`users/${id}/team`] = team;
            updates[`users/${id}/status`] = "alive";
        });

        // 게임 상태 업데이트 및 채팅창 공지
        updates['gameInfo/state'] = "night";
        updates['gameInfo/day'] = 1;
        updates['chat'] = null; // 기존 채팅 초기화 (선택 사항)

        db.ref().update(updates);
        sendSystemMessage("게임이 시작되었습니다. 첫 번째 밤이 찾아옵니다.");
    });
}

// 3. 상태 리스너 (게임 단계 변화 감지)
function listenGameState() {
    db.ref('gameInfo/state').on('value', (snapshot) => {
        gameState = snapshot.val();
        if (!gameState) return;

        // 내 직업 정보 동기화
        db.ref(`users/${myId}`).once('value', (userSnap) => {
            const userData = userSnap.val();
            if (userData && userData.job) {
                myJob = userData.job;
                myTeam = userData.team;
                isDead = userData.status === "dead";
                
                // 직업 확인 메시지 (개인용)
                if (gameState === "night" && !isDead) {
                    displayMessage("시스템", `당신의 직업은 [${myJob}] (진영: ${myTeam}) 입니다.`, "system");
                }
            }
        });

        handlePhaseChange(gameState);
    });
}

// 4. 단계별 채팅 및 UI 제어
function handlePhaseChange(state) {
    const chatInput = document.getElementById('chat-input');
    
    if (state === "night") {
        document.body.style.backgroundColor = "#050510"; // 밤 분위기
        // 마피아나 연인만 채팅 가능하게 로직 추가
        if (myTeam === "mafia" || myJob === "연인") {
            chatInput.disabled = false;
            chatInput.placeholder = "밤 비밀 채팅 가능...";
        } else {
            chatInput.disabled = true;
            chatInput.placeholder = "밤에는 조용히 해야 합니다...";
        }
        startTimer(60); // 밤 시간 1분
    } else {
        document.body.style.backgroundColor = "#0c0c0c";
        chatInput.disabled = false;
        chatInput.placeholder = "메시지를 입력하세요...";
    }
}

// 5. 타이머 기능
function startTimer(seconds) {
    let timeLeft = seconds;
    const timerDisplay = document.getElementById('timer');
    
    const interval = setInterval(() => {
        const mins = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;
        timerDisplay.innerText = `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
        
        if (timeLeft <= 0) {
            clearInterval(interval);
            if (isHost && gameState === "night") {
                // 밤이 끝나면 아침으로 전환 (방장이 제어)
                db.ref('gameInfo/state').set("morning");
            }
        }
        timeLeft--;
    }, 1000);
}

// 시스템 메시지 전송 함수
function sendSystemMessage(text) {
    db.ref('chat').push({
        sender: "시스템",
        text: text,
        type: "system"
    });
}

// 기존 Part 2의 enterRoom 함수 끝에 listenGameState(); 를 추가해야 합니다.
    
// 1. 아침(Morning) 처리
function processMorning() {
    if (!isHost) return; // 방장만 계산을 수행해서 DB에 올림

    db.ref('actions').once('value', (snapshot) => {
        const actions = snapshot.val() || {};
        const deadPlayers = []; // 이번 밤에 죽은 사람 목록

        // [핵심 로직] 공격 우선순위 및 의사 치료 계산
        // (Part 3에서 사용자들이 선택한 target 데이터를 actions에 저장했다는 가정)
        
        // 예시: 간단한 마피아 공격 로직
        for (let actorId in actions) {
            let action = actions[actorId];
            if (action.type === "kill") {
                // 의사의 치료(heal) 여부 확인 필요 (생략된 로직은 Part 5에서 상세화)
                deadPlayers.push(action.target);
            }
        }

        // DB 업데이트: 사망자 처리 및 상태 변경
        const updates = {};
        deadPlayers.forEach(pid => {
            updates[`users/${pid}/status`] = "dead";
        });
        updates['gameInfo/state'] = "evening"; // 아침 발표 후 바로 투표/회의 단계로
        updates['gameInfo/lastDead'] = deadPlayers;
        updates['actions'] = null; // 액션 초기화

        db.ref().update(updates);
    });
}

// 2. 투표 UI 생성 (저녁 단계)
function showVoteUI() {
    if (isDead) return;

    db.ref('users').once('value', (snapshot) => {
        const users = snapshot.val();
        let voteHTML = '<div id="vote-panel" class="modal"><div class="modal-content"><h3>투표하세요</h3>';
        
        for (let id in users) {
            if (users[id].status === "alive") {
                voteHTML += `<button onclick="castVote('${id}')">${users[id].nickname}</button>`;
            }
        }
        voteHTML += '<button onclick="castVote(\'skip\')">기권</button></div></div>';
        document.body.insertAdjacentHTML('beforeend', voteHTML);
    });
}

// 3. 투표 실행
function castVote(targetId) {
    db.ref(`votes/${myId}`).set({
        voter: myId,
        target: targetId,
        weight: (myJob === "시장") ? 3 : 1 // 시장은 3표
    });
    const panel = document.getElementById('vote-panel');
    if (panel) panel.remove();
    displayMessage("시스템", "투표를 완료했습니다.", "system");
}

// 4. 개표 및 결과 발표 (개표인 조작 포함)
function processVoteResult() {
    if (!isHost) return;

    db.ref('votes').once('value', (snapshot) => {
        const votes = snapshot.val() || {};
        // 개표인이 있는지 확인
        db.ref('users').orderByChild('job').equalTo('개표인').once('value', (userSnap) => {
            const tallyMan = userSnap.val();
            
            if (tallyMan) {
                // 개표인이 살아있다면 '개표 시작' 30초 부여
                sendSystemMessage("개표인이 투표 결과를 조작 중입니다. (30초)");
                setTimeout(() => finalizeVote(votes), 30000);
            } else {
                finalizeVote(votes);
            }
        });
    });
}

function finalizeVote(votes) {
    // 가장 표를 많이 받은 사람 선출 로직
    // 결과에 따라 유저 status를 "dead"로 바꾸고 다시 밤(night)으로 전환
    sendSystemMessage("투표 결과, 한 명이 처형되었습니다.");
    decideWeather();
    db.ref('gameInfo/state').set("night");
    db.ref('votes').remove();
}

// 1. 기상 상황 정의 및 발생 로직
const WEATHER_TYPES = {
    A: { name: "황사", desc: "감시자 능력 불가, 배신자 전직 지연" },
    B: { name: "정전", desc: "개표인 조작 기회, 중립 직업 능력 불가" },
    C: { name: "한파/폭염", desc: "회의 시간 단축, 밤에 무작위 사망 발생" },
    D: { name: "홍수", desc: "회의 건너뛰기, 시장/개표인 능력 불가" },
    E: { name: "안개", desc: "경찰 조사 오류, 마녀 낮 살해 봉쇄" },
    F: { name: "계엄령", desc: "회의 없음, 무조건 처형, 자경단 페널티 면제" },
    G: { name: "축제", desc: "회의 시간 2배, 아무도 안 죽으면 감염 치료" }
};

let currentWeather = null;

// 밤이 시작될 때 방장이 날씨를 결정
function decideWeather() {
    if (!isHost) return;

    let rand = Math.random() * 100;
    let selected = null;

    if (rand < 10) selected = "A";
    else if (rand < 20) selected = "B";
    else if (rand < 30) selected = "C";
    else if (rand < 40) selected = "D";
    else if (rand < 50) selected = "E";
    else if (rand < 60) selected = "F";
    else if (rand < 70) selected = "G";
    else selected = "NONE"; // 30% 확률로 맑음

    db.ref('gameInfo/weather').set(selected);
}

// 2. 날씨 및 직업별 능력 제한 로직 (상태 변화 리스너에 추가)
function listenWeather() {
    db.ref('gameInfo/weather').on('value', (snapshot) => {
        currentWeather = snapshot.val();
        if (currentWeather && currentWeather !== "NONE") {
            const w = WEATHER_TYPES[currentWeather];
            sendSystemMessage(`[기상 공지: ${w.name}] ${w.desc}`);
            applyWeatherEffect(currentWeather);
        }
    });
}

    } else if (weather === "G") { // 축제

        // (상세 인원 카운트 로직 구현...)

}

function endGame(winnerTitle, message) {
    db.ref('chat').push({
        sender: "📢 종료",
        text: `[${winnerTitle}] ${message}`,
        type: "system"
    });
    // 모든 유저 입력창 차단
    document.getElementById('chat-input').disabled = true;
    gameState = "finished";
}

// 5. 밤 활동 데이터 전송 (방식 보완)
function useAbility(targetId) {
    if (gameState !== "night" || isDead) return;
    
    // 날씨에 따른 능력 봉쇄 체크
    if (currentWeather === "A" && myJob === "감시자") return alert("황사로 인해 능력을 쓸 수 없습니다.");
    if (currentWeather === "B" && myTeam === "neutral") return alert("정전으로 인해 능력을 쓸 수 없습니다.");

    db.ref(`actions/${myId}`).set({
        actor: myId,
        target: targetId,
        type: JOBS[myJobId].ability
    });
    displayMessage("시스템", `${targetId}에게 능력을 사용했습니다.`, "system");
}
// 1. 설정창 열기/닫기 및 직업 리스트 생성
document.getElementById('setup-btn').addEventListener('click', () => {
    if (!isHost) return alert("방장만 설정을 변경할 수 있습니다.");
    document.getElementById('setup-modal').classList.remove('hidden');
    renderJobChecklist();
});

function closeSetup() {
    document.getElementById('setup-modal').classList.add('hidden');
}

function renderJobChecklist() {
    const listEl = document.getElementById('job-checklist');
    listEl.innerHTML = "";
    // JOBS 객체에서 1~21번까지 체크박스 생성
    for (let id in JOBS) {
        listEl.innerHTML += `
            <div class="job-opt">
                <input type="checkbox" class="job-check" value="${id}" checked>
                <span>${JOBS[id].name}</span>
            </div>
        `;
    }
}

// 2. 설정값을 DB에 저장
function saveSetup() {
    const config = {
        meetingTime: document.getElementById('setup-meeting-time').value,
        voteTime: document.getElementById('setup-vote-time').value,
        mafiaCount: document.getElementById('setup-mafia-count').value,
        enabledJobs: Array.from(document.querySelectorAll('.job-check:checked')).map(el => el.value)
    };
    db.ref('gameConfig').set(config);
    alert("설정이 저장되었습니다.");
    closeSetup();
}

// 3. 게임 시작 시 설정값 반영 (Part 3의 startGame 수정 버전)
function startGameWithConfig() {
    db.ref('gameConfig').once('value', (configSnap) => {
        const config = configSnap.val() || { meetingTime: 60, mafiaCount: 1, enabledJobs: [21] };
        
        db.ref('users').once('value', (userSnap) => {
            const users = userSnap.val();
            const userIds = Object.keys(users);
            if (userIds.length < 3) return sendSystemMessage("게임은 3명 이상 필요합니다.");

            // 설정된 직업 리스트에서 인원수만큼 랜덤 추출
            let pool = [...config.enabledJobs];
            let selectedJobs = [];
            
            // 인원수 맞추기 (시민으로 채우기 등)
            for(let i=0; i<userIds.length; i++) {
                let jobIndex = Math.floor(Math.random() * pool.length);
                selectedJobs.push(pool[jobIndex]);
            }

            // ... 이후 Part 3의 직업 배분 및 DB 업데이트 로직 실행 ...
            // (이전 파트에서 만든 startGame 로직에 config 값을 대입)
        });
    });
}

document.getElementById('help-btn').onclick = () => document.getElementById('help-modal').classList.remove('hidden');
document.querySelector('.close-modal').onclick = () => document.getElementById('help-modal').classList.add('hidden');
